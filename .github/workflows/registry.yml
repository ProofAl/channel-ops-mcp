name: Publish public demo to MCP Registry

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: mcp-registry-demo
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ProofAl/channel-ops-mcp' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Read the manifest at the dispatched commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/contents/server.json?ref=$GITHUB_SHA" --jq .content |
            base64 --decode > server.json
          jq -e '.name == "io.github.ProofAl/channel-ops-demo" and
            (.remotes | length) == 1 and
            .remotes[0].url == "https://channel-ops-lab.knowingfoxglove4.chatgpt.site/demo/mcp"' server.json

      - name: Verify that the public endpoint serves both demo tools
        run: |
          set -euo pipefail
          endpoint=$(jq -r '.remotes[0].url' server.json)
          rpc() {
            curl --proto '=https' --max-time 20 --fail-with-body --silent --show-error \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2025-11-25' --data-binary "$1" "$endpoint"
          }
          rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"registry-check","version":"1"}}}' |
            jq -e '.result.serverInfo.name == "channel-ops-demo" and .result.protocolVersion == "2025-11-25"'
          rpc '{"jsonrpc":"2.0","method":"notifications/initialized"}'
          rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' |
            jq -e '[.result.tools[].name] | sort == ["demo_contribution", "draft_campaign_link"]'

      - name: Verify publisher and publish metadata
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz' \
            -o publisher.tar.gz
          echo '6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05  publisher.tar.gz' | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

      - name: Confirm the published version and remote URL
        run: |
          set -euo pipefail
          name=$(jq -r '.name | @uri' server.json)
          version=$(jq -r .version server.json)
          endpoint=$(jq -r '.remotes[0].url' server.json)
          curl --proto '=https' --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/$version" |
            jq -e --arg url "$endpoint" --arg version "$version" \
              '.server.version == $version and .server.remotes[0].url == $url and
               ._meta["io.modelcontextprotocol.registry/official"].status == "active"'
